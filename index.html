<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJ Store</title>
    <link rel="stylesheet" href="CSS/master.css">
    <link rel="stylesheet" href="CSS/all.min.css">
    <style>
        html {
            overflow: hidden;
        }
        body {
            background-color: red;
            background-image: url(Images/SAVE_20261026_205434.jpg);
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
    </style>
</head>
<body>
        <script src="https://accounts.google.com/gsi/client" async></script>
    <div id="loading-screen">
        <video loop autoplay muted playsinline>
            <source src="Videos/loading-screen.mp4" type="video/mp4">
        </video>
    </div>
    <div id="main-container" class="container">
        <h1 id="store-welcome">welcome to <span id="brand-block"><span>aj</span>Store<sup style="font-size: .4em;">TM</sup></span></h1>
        <p id="store-quote">where we turn your dream designs into reality</p>
        <form action="" method="post" id="login-form">
            <input type="text" spellcheck="false" autocomplete="username" required name="username" id="username" placeholder="User Name">
            <div class="password-container">
                <input style="width: 100%;" type="password" spellcheck="false" autocomplete="current-password" required name="password" id="password" placeholder="Password">
                <i class="eye-icon fa-regular fa-eye"></i>
            </div>
            <input type="submit" value="SIGN IN" id="sign-in">
        </form>
        <a href="https://www.google.com" id="forgot-password">forgot your password?</a>
        <div id="g_id_onload"
            data-client_id="YOUR_GOOGLE_CLIENT_ID"
            data-login_uri="https://your.domain/your_login_endpoint"
            data-auto_prompt="false">
        </div>
        <div class="google-buton-wrapper">
            <div class="g_id_signin"
            data-type="standard"
            data-size="large"
            data-width="400px"
            data-theme="outline"
            data-text="sign_in_with"
            data-shape="pill"
            data-logo_alignment="left">
        </div>
        </div>
        <a href="https://www.google.com" id="about-us">about us</a>
        <span id="rights">all rights reserved</span>
        <script src="JS/node.js"></script>
    </div>
</body>
</html>
