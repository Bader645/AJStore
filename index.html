<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJ Store</title>
    <link rel="stylesheet" href="CSS/master.css">
    <style>
        html {
            overflow: hidden;
        }
        body {
            background-color: red;
            background-image: url(Images/SAVE_20261026_205434.jpg);
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <video src="LoadingScreen/videos/VID-20261030-WA0013.mp4" loop autoplay muted playsinline></video>
    </div>
    <div id="main-container" class="container">
        <h1 id="store-welcome">welcome to <span id="brand-block"><span>aj</span>Store<sup style="font-size: .4em;">TM</sup></span></h1>
        <p id="store-quote">where we turn your dream designs into reality</p>
        <form action="" method="post">
            <input type="text" name="" id="username" placeholder="User Name">
            <input type="password" name="" id="password" placeholder="Password">
            <input type="submit" value="SIGN IN" id="sign-in">
        </form>
        <a href="https://www.google.com" id="forgot-password">forgot your password?</a>
        <span class="breaker"></span>
        <a href="https://www.google.com" id="about-us">about us</a>
        <span id="rights">all rights reserved</span>
        <script src="JS/node.js"></script>
    </div>
</body>
</html>
